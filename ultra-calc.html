<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070718">
<meta name="description" content="ROSTO ∞ — أقوى آلة حاسبة في العالم: حلّال ذكي، رسم بياني تفاعلي، هندسة، كيمياء، فيزياء، مصفوفات، كاميرا OCR.">
<title>ROSTO ∞ | أقوى آلة حاسبة في العالم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nerdamer/1.1.13/nerdamer.core.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nerdamer/1.1.13/Algebra.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nerdamer/1.1.13/Calculus.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nerdamer/1.1.13/Solve.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nerdamer/1.1.13/Extra.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.5/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior-y:contain}
body{font-family:'Cairo',system-ui,sans-serif;color:var(--text);background:var(--bg1);overflow-x:hidden;transition:background .5s,color .3s}
body[data-theme=neon]{--bg1:#070718;--bg2:#1b0a3c;--ac:#00f5d4;--ac2:#f72585;--ac3:#7b2ff7;--text:#eef0ff;--mut:#9aa0c8;--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--key:rgba(255,255,255,.08);--ink:#06121a;--grid:rgba(255,255,255,.08);--ok:#80ed99;--err:#ff5d73}
body[data-theme=ocean]{--bg1:#02142c;--bg2:#06487a;--ac:#48cae4;--ac2:#ffd166;--ac3:#0077b6;--text:#eaf8ff;--mut:#9cc3d8;--glass:rgba(255,255,255,.08);--bd:rgba(255,255,255,.16);--key:rgba(255,255,255,.09);--ink:#02202e;--grid:rgba(255,255,255,.09);--ok:#80ed99;--err:#ff5d73}
body[data-theme=sunset]{--bg1:#25072b;--bg2:#7a1f3d;--ac:#ffb703;--ac2:#ff4d6d;--ac3:#fb8500;--text:#fff1e6;--mut:#e0b6b6;--glass:rgba(255,255,255,.08);--bd:rgba(255,255,255,.16);--key:rgba(255,255,255,.09);--ink:#2a1200;--grid:rgba(255,255,255,.09);--ok:#80ed99;--err:#ff5d73}
body[data-theme=forest]{--bg1:#04160f;--bg2:#0b3d2b;--ac:#6ee7a8;--ac2:#f4e285;--ac3:#2d6a4f;--text:#eafff3;--mut:#9cc9b2;--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--key:rgba(255,255,255,.08);--ink:#06210f;--grid:rgba(255,255,255,.08);--ok:#80ed99;--err:#ff5d73}
body[data-theme=royal]{--bg1:#140a33;--bg2:#3a1a7a;--ac:#c77dff;--ac2:#ffd60a;--ac3:#7209b7;--text:#f5eeff;--mut:#bba6e0;--glass:rgba(255,255,255,.08);--bd:rgba(255,255,255,.16);--key:rgba(255,255,255,.09);--ink:#1a0838;--grid:rgba(255,255,255,.09);--ok:#80ed99;--err:#ff5d73}
body[data-theme=light]{--bg1:#eef2ff;--bg2:#dbe4ff;--ac:#4f46e5;--ac2:#ec4899;--ac3:#7c3aed;--text:#12122b;--mut:#5b5f80;--glass:rgba(255,255,255,.78);--bd:rgba(30,30,80,.15);--key:rgba(255,255,255,.95);--ink:#fff;--grid:rgba(0,0,0,.09);--ok:#059669;--err:#dc2626}
.bg{position:fixed;inset:0;z-index:-3;background:linear-gradient(160deg,var(--bg1),var(--bg2))}
.bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--ac) 12%,transparent),transparent 60%)}
.blob{position:fixed;z-index:-2;border-radius:50%;filter:blur(90px);opacity:.42;animation:float 18s ease-in-out infinite alternate;pointer-events:none}
.b1{width:360px;height:360px;background:var(--ac);top:-100px;left:-100px}
.b2{width:320px;height:320px;background:var(--ac2);bottom:-90px;right:-90px;animation-delay:-6s}
.b3{width:240px;height:240px;background:var(--ac3);top:40%;right:-80px;animation-delay:-12s;opacity:.28}
@keyframes float{to{transform:translate(40px,60px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.blob{animation:none}*{transition:none!important;animation:none!important}}
.wrap{max-width:800px;margin:0 auto;padding:10px 12px 100px;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 10px;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:44px;height:44px;flex:0 0 auto;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:900;font-size:1.25rem;color:var(--ink);box-shadow:0 8px 26px -8px var(--ac),inset 0 1px 0 rgba(255,255,255,.4);position:relative;overflow:hidden}
.mark::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:shine 4s linear infinite}
@keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
.logo{font-weight:900;font-size:1.5rem;letter-spacing:.5px;line-height:1.1;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 6s linear infinite}
@keyframes grad{to{background-position:200% center}}
.logo small{display:block;font-size:.62rem;font-weight:600;color:var(--mut);-webkit-text-fill-color:var(--mut);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.hbtns{display:flex;gap:8px;flex:0 0 auto}
.ib{border:1px solid var(--bd);background:var(--glass);color:var(--text);border-radius:12px;min-width:42px;height:42px;font:700 .85rem 'Cairo';cursor:pointer;backdrop-filter:blur(12px);padding:0 10px;transition:.2s;display:grid;place-items:center}
.ib:hover{border-color:var(--ac)}
.ib:active{transform:scale(.92)}
nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:8px 2px 12px;scrollbar-width:none;background:linear-gradient(var(--bg1) 65%,transparent);margin-bottom:2px}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--glass);color:var(--mut);padding:9px 14px;border-radius:999px;font:700 .85rem 'Cairo';cursor:pointer;backdrop-filter:blur(12px);transition:.2s;white-space:nowrap}
nav button:hover{color:var(--text);border-color:var(--ac)}
nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink);border-color:transparent;box-shadow:0 6px 22px -6px var(--ac)}
.panel{display:none;animation:in .3s ease}
.panel.active{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(16px);box-shadow:0 12px 34px -16px rgba(0,0,0,.55)}
.card h3{margin:0 0 10px;font-size:1rem;display:flex;align-items:center;gap:8px}
.display{padding:14px 18px;background:linear-gradient(160deg,var(--glass),color-mix(in srgb,var(--ac) 6%,var(--glass)))}
.display .top{display:flex;justify-content:space-between;align-items:center;min-height:26px;gap:8px}
.badge{font:700 .72rem 'JetBrains Mono';padding:4px 12px;border-radius:99px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink);cursor:pointer;user-select:none;transition:.2s;box-shadow:0 3px 12px -4px var(--ac)}
.badge:active{transform:scale(.94)}
.hl{color:var(--mut);font:.8rem 'JetBrains Mono';direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%}
#expr{width:100%;background:none;border:0;outline:0;color:var(--text);font:600 1.75rem 'JetBrains Mono',monospace;text-align:left;padding:8px 0;direction:ltr}
#expr::placeholder{color:var(--mut);opacity:.5}
#res{font:800 2.6rem 'JetBrains Mono',monospace;text-align:left;min-height:56px;overflow-x:auto;white-space:nowrap;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr;scrollbar-width:none;transition:font-size .15s}
#res::-webkit-scrollbar{display:none}
#res.err{background:none;color:var(--err);-webkit-text-fill-color:var(--err);font-size:1.35rem;animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--glass);color:var(--text);padding:8px 14px;border-radius:999px;font:700 .8rem 'Cairo';cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--ac)}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink);border-color:transparent;box-shadow:0 4px 16px -6px var(--ac)}
.chip:active{transform:scale(.94)}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
.k{border:1px solid var(--bd);background:var(--key);color:var(--text);border-radius:16px;font:700 1.1rem 'JetBrains Mono',monospace;padding:16px 0;cursor:pointer;transition:transform .1s,background .15s,border-color .15s;backdrop-filter:blur(10px);position:relative;overflow:hidden;user-select:none}
.k::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,var(--ac) 0%,transparent 60%);opacity:0;transition:opacity .3s}
.k:hover{background:var(--glass);border-color:var(--ac)}
.k:hover::after{opacity:.08}
.k:active{transform:scale(.9);background:color-mix(in srgb,var(--ac) 20%,var(--key))}
.k.fn{color:var(--ac);font-size:.88rem;padding:14px 0}
.k.op{color:var(--ac2);font-size:1.35rem}
.k.clr{color:var(--err)}
.k.eq{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink);border:0;font-size:1.5rem;font-weight:900;box-shadow:0 8px 24px -8px var(--ac2)}
.k.eq:hover{filter:brightness(1.1)}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--key);border:1px solid var(--bd);border-radius:14px;color:var(--text);font:600 1rem 'JetBrains Mono','Cairo',monospace;padding:12px 14px;outline:0;direction:ltr;text-align:left;transition:border-color .2s,box-shadow .2s;font-family:'JetBrains Mono',monospace}
select{direction:inherit;font-family:'Cairo';cursor:pointer;font-weight:700}
select option{color:#111;background:#fff}
textarea{resize:vertical;min-height:84px;line-height:1.5}
textarea:focus,input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1 1 90px}
.row.fixed>*{flex:0 0 auto}
label.f{display:block;font-size:.78rem;color:var(--mut);margin:8px 2px 4px;font-weight:600}
.btn{border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink);padding:14px 20px;border-radius:14px;font:800 1rem 'Cairo';cursor:pointer;box-shadow:0 8px 22px -8px var(--ac);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:scale(.96) translateY(0)}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--bd);box-shadow:none}
.btn.ghost:hover{border-color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.res-card{border-inline-start:4px solid var(--ac);animation:in .3s}
.res-card h4{margin:0 0 8px;font-size:.9rem;color:var(--mut);font-weight:700}
.ans{font:700 1.25rem 'JetBrains Mono',monospace;direction:ltr;text-align:left;word-break:break-word;padding:3px 0;line-height:1.4;color:var(--text)}
.dec{font:.9rem 'JetBrains Mono',monospace;color:var(--ac);direction:ltr;text-align:left;margin-top:2px}
.steps{margin:10px 0 0;padding-inline-start:18px;color:var(--mut);font-size:.88rem}
.steps li{margin:5px 0;direction:ltr;text-align:left;list-style-position:inside;line-height:1.5}
.err-t{color:var(--err);font-weight:700;padding:4px 0;line-height:1.5}
.ok-t{color:var(--ok);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--bd);align-items:center;font-size:.92rem}
.kv:last-child{border:0}
.kv b{font-family:'JetBrains Mono';direction:ltr;color:var(--ac);font-weight:700;text-align:right;word-break:break-word}
table.m{border-collapse:separate;border-spacing:5px;direction:ltr;margin:6px 0}
table.m td{background:var(--key);border:1px solid var(--bd);border-radius:8px;padding:7px 13px;font:600 .95rem 'JetBrains Mono';text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t td,table.t th{padding:8px 6px;border-bottom:1px dashed var(--bd);text-align:start}
table.t th{color:var(--mut);font-weight:700;font-size:.8rem}
#gcv{width:100%;height:400px;display:block;border-radius:18px;background:var(--key);border:1px solid var(--bd);touch-action:none;cursor:grab}
#gco{font:.78rem 'JetBrains Mono';color:var(--mut);direction:ltr;min-height:22px;margin-top:8px;text-align:left}
.cam-box{position:relative;border-radius:18px;overflow:hidden;background:#000;display:none;margin-top:10px}
.cam-box video{width:100%;display:block;max-height:360px;object-fit:cover}
.cam-box .frame{position:absolute;inset:16% 7%;border:2px dashed var(--ac);border-radius:14px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.4);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
#ocr-prev{width:100%;border-radius:14px;display:none;margin-top:10px;border:1px solid var(--bd);max-height:300px;object-fit:contain;background:#000}
.prog{height:8px;background:var(--key);border-radius:99px;overflow:hidden;margin:10px 0;display:none;border:1px solid var(--bd)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .25s ease}
.hist-i{padding:12px 10px;border-bottom:1px dashed var(--bd);cursor:pointer;transition:.15s;border-radius:10px}
.hist-i:hover{background:var(--key)}
.hist-i:last-child{border-bottom:0}
.hist-i small{color:var(--mut);display:block;font-family:'JetBrains Mono';direction:ltr;text-align:left;font-size:.82rem;margin-bottom:3px;word-break:break-word}
.hist-i b{font-family:'JetBrains Mono';direction:ltr;display:block;text-align:left;color:var(--ac);font-size:.95rem;word-break:break-word}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--text);color:var(--bg1);padding:12px 22px;border-radius:99px;font-weight:700;z-index:99;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s;max-width:92%;text-align:center;opacity:0;box-shadow:0 10px 40px -10px rgba(0,0,0,.5);font-size:.9rem}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.hint{font-size:.78rem;color:var(--mut);margin:8px 2px;line-height:1.6}
.consts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.consts div{background:var(--key);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:.8rem;line-height:1.4}
.consts b{display:block;font-family:'JetBrains Mono';color:var(--ac);direction:ltr;text-align:left;font-size:.82rem;margin-top:3px;word-break:break-word}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink);border:0;font-size:1.5rem;cursor:pointer;box-shadow:0 10px 30px -6px var(--ac);z-index:50;display:grid;place-items:center;transition:.2s}
.fab:active{transform:scale(.9)}
@media(min-width:700px){.k{padding:18px 0}}
@media(max-width:380px){.logo{font-size:1.25rem}.mark{width:38px;height:38px}.k{padding:13px 0;font-size:1rem}}
</style>
</head>
<body data-theme="neon">
<div class="bg"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
<header>
  <div class="brand">
    <div class="mark">R</div>
    <div class="logo">ROSTO ∞<small class="t" data-ar="أقوى آلة حاسبة في العالم" data-en="The world's most powerful calculator"></small></div>
  </div>
  <div class="hbtns"><button class="ib" id="btn-theme" title="Theme">🎨</button><button class="ib" id="btn-lang">EN</button></div>
</header>
<nav id="nav"></nav>

<!-- Calculator -->

<section class="panel active" id="p-calc">
  <div class="card display">
    <div class="top"><span class="badge" id="degb">DEG</span><span class="hl" id="hl"></span></div>
    <input id="expr" dir="ltr" inputmode="none" autocomplete="off" spellcheck="false" placeholder="0">
    <div id="res" dir="ltr">0</div>
  </div>
  <div class="actions">
    <button class="chip" id="c-solver">🧠 <span class="t" data-ar="ارسل للحلّال" data-en="Send to Solver"></span></button>
    <button class="chip" id="c-graph">📈 <span class="t" data-ar="ارسم" data-en="Plot"></span></button>
    <button class="chip" id="c-copy">📋 <span class="t" data-ar="انسخ" data-en="Copy"></span></button>
    <button class="chip" id="c-paste">📥 <span class="t" data-ar="الصق" data-en="Paste"></span></button>
  </div>
  <div class="keypad" id="keypad"></div>
</section>

<!-- Solver -->

<section class="panel" id="p-solve">
  <div class="card">
    <div class="chips" id="modes"></div>
    <textarea id="sv-in" placeholder="x^2 - 5x + 6 = 0"></textarea>
    <div class="row" style="margin-top:8px">
      <div id="f-var"><label class="f t" data-ar="المتغير" data-en="Variable"></label><input type="text" id="sv-var" placeholder="x"></div>
      <div id="f-a"><label class="f" id="la">a</label><input type="text" id="sv-a" placeholder="0"></div>
      <div id="f-b"><label class="f" id="lb">b</label><input type="text" id="sv-b" placeholder="1"></div>
    </div>
    <div class="row fixed" style="margin-top:10px">
      <button class="btn" id="sv-go" style="flex:1">⚡ <span class="t" data-ar="حلّ" data-en="Solve"></span></button>
      <button class="btn ghost" id="sv-graph">📈</button>
      <button class="btn ghost" id="sv-clear">✕</button>
    </div>
    <div class="chips" id="examples" style="margin-top:10px"></div>
    <div class="hint t" data-ar="اكتب أي حاجة: معادلة، نظام معادلات (افصل بـ ;)، مشتقة، تكامل، نهاية… واختار «تلقائي» والحلّال هيفهم لوحده." data-en="Type anything: equation, system (separate with ;), derivative, integral, limit… pick Auto and it figures it out."></div>
  </div>
  <div id="sv-out"></div>
</section>

<!-- Graph -->

<section class="panel" id="p-graph">
  <div class="card">
    <textarea id="g-in" style="min-height:70px">sin(x)
x^2/10
1/x</textarea>
    <div class="hint t" data-ar="دالة في كل سطر. اسحب للتحريك، كبّر بالعجلة أو بإصبعين. اضغط على الرسم عشان تشوف إحداثيات النقطة." data-en="One function per line. Drag to pan, wheel or pinch to zoom. Tap the graph to see point coordinates."></div>
    <div class="row fixed" style="margin:8px 0"><button class="btn" id="g-draw">📈 <span class="t" data-ar="ارسم" data-en="Plot"></span></button><button class="btn ghost" id="g-in2">＋</button><button class="btn ghost" id="g-out">－</button><button class="btn ghost" id="g-reset">⟲</button></div>
    <canvas id="gcv"></canvas><div id="gco"></div>
  </div>
</section>

<!-- Geometry -->

<section class="panel" id="p-geo">
  <div class="card"><select id="geo-sel"></select><div id="geo-f" class="grid2" style="margin-top:10px"></div></div>
  <div class="card" id="geo-out"></div>
</section>

<!-- Science -->

<section class="panel" id="p-sci">
  <div class="chips" id="sci-tabs"></div>
  <div id="sci-phys">
    <div class="card"><select id="ph-sel"></select><div id="ph-f" class="grid2" style="margin-top:10px"></div>
      <div class="hint t" data-ar="سيب خانة واحدة فاضية — هي اللي هتتحسب." data-en="Leave exactly one field empty — that's the one to solve for."></div>
      <button class="btn" id="ph-go" style="width:100%;margin-top:6px">⚡ <span class="t" data-ar="احسب" data-en="Calculate"></span></button></div>
    <div id="ph-out"></div>

/* ---------- i18n & nav ---------- */

/* ---------- Calculator ---------- /
const KEYS=[['sin','sin(','fn'],['cos','cos(','fn'],['tan','tan(','fn'],['ln','log(','fn'],['log','log10(','fn'],
['sin⁻¹','asin(','fn'],['cos⁻¹','acos(','fn'],['tan⁻¹','atan(','fn'],['eˣ','e^(','fn'],['10ˣ','10^(','fn'],

const mkScope=()=>{const r=x=>DEG?xMath.PI/180:x,b=x=>DEG?x*180/Math.PI:x;return{sin:x=>math.sin(r(x)),cos:x=>math.cos(r(x)),tan:x=>math.tan(r(x)),asin:x=>b(math.asin(x)),acos:x=>b(math.acos(x)),atan:x=>b(math.atan(x)),Ans:isNaN(+ans)?0:+ans}};
function evalExpr(raw){const s=norm(raw).replace(/%/g,'/100');const v=math.evaluate(s,mkScope());const val=(v&&v.entries&&Array.isArray(v.entries))?v.entries[v.entries.length-1]:v;if(typeof val==='function'||val===undefined)throw new Error('x');return val}
function ins(t){const e=$('#expr');const s=e.selectionStart??e.value.length,en=e.selectionEnd??s;e.value=e.value.slice(0,s)+t+e.value.slice(en);const p=s+t.length;e.focus({preventScroll:true});e.setSelectionRange(p,p);live()}

function buildKeypad(){$('#keypad').innerHTML=KEYS.map((k,i)=><button class="k ${k[2]||''}" data-i="${i}">${k[0]}</button>).join('');$$('#keypad .k').forEach(b=>b.onclick=()=>{const k=KEYS[b.dataset.i][1];if(navigator.vibrate)navigator.vibrate(8);if(k==='AC'){$('#expr').value='';$('#hl').textContent='';live()}else if(k==='BK'){const e=$('#expr'),s=e.selectionStart,en=e.selectionEnd;if(s!==en){e.setRangeText('')}else if(s>0){e.setRangeText('',s-1,s)}live()}else if(k==='EQ')equals();else ins(k)})}

$('#degb').onclick=()=>{DEG=!DEG;$('#degb').textContent=DEG?'DEG':'RAD';live()};
$('#c-solver').onclick=()=>{$('#sv-in').value=$('#expr').value;showTab('solve')};
$('#c-graph').onclick=()=>{const v=$('#expr').value.trim();if(v)$('#g-in').value=v;showTab('graph')};
$('#c-copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($('#res').textContent).then(()=>toast(L('تم النسخ ✓','Copied ✓')))};
$('#c-paste').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t){$('#expr').value=t;live()}}catch(_){toast(L('مقدرتش أقرأ الحافظة','Cannot read clipboard'))}};

/* ---------- Solver ---------- */
const MODES=[['auto','✨','تلقائي','Auto'],['solve','＝','معادلة','Equation'],['system','{ }','نظام','System'],['diff','d/dx','مشتقة','Derivative'],['int','∫','تكامل','Integral'],['defint','∫ₐᵇ','تكامل محدد','Definite ∫'],['limit','lim','نهاية','Limit'],['factor','ƒ','تحليل','Factor'],['expand','( )','فك الأقواس','Expand'],['simplify','≈','تبسيط','Simplify']];
const EXAMPLES=['x^2-5x+6=0','2x+3=11','x+y=5; x-y=1','sin(x)=x/2','x^3-6x^2+11x-6','x^2+2x+5=0','2^x=64','sqrt(144)+3!','1/3+1/4'];
function buildModes(){$('#modes').innerHTML=MODES.map(m=>`<button class="chip ${m[0]===curMode?'on':''}" data-m="${m[0]}">${m[1]} ${L(m[2],m[3])}</button>`).join('');$$('#modes .chip').forEach(b=>b.onclick=()=>{curMode=b.dataset.m;buildModes();setLabels()})}
function buildExamples(){$('#examples').innerHTML=EXAMPLES.map(e=><button class="chip" dir="ltr">${esc(e)}</button>).join('');$$('#examples .chip').forEach(b=>b.onclick=()=>{$('#sv-in').value=b.textContent;curMode='auto';buildModes();setLabels();runSolver()})}
function setLabels(){const m=curMode;$('#f-var').style.display=['solve','diff','int','defint','limit'].includes(m)?'':'none';$('#f-a').style.display=['defint','limit'].includes(m)?'':'none';$('#f-b').style.display=m==='defint'?'':'none';$('#la').textContent=m==='limit'?L('عندما → ','as → '):L('من (a)','from (a)');$('#lb').textContent=L('إلى (b)','to (b)');$('#sv-in').placeholder={auto:'x^2 - 5x + 6 = 0',solve:'2x + 3 = 11',system:'x + y = 5; x - y = 1',diff:'x^3*sin(x)',int:'x*e^x',defint:'x^2',limit:'sin(x)/x',factor:'x^2-9',expand:'(x+1)^3',simplify:'(x^2-1)/(x-1)'}[m]}
const card=(title,body,bad)=>{const d=document.createElement('div');d.className='card res-card';if(bad)d.style.borderInlineStartColor='#ff5d73';d.innerHTML=`<h4>${title}</h4>${body}`;$('#sv-out').appendChild(d)};
const ansH=(s,dec)=><div class="ans">${esc(pretty(s))}</div>${dec?<div class="dec">≈ ${esc(dec)}</div>`:''}`;
function approx(e){try{const t=nerdamer(e).evaluate().text('decimals');const n=Number(t);if(t&&!isNaN(n))return fmt(+n.toPrecision(10));return t.length<50&&t!==String(e)?t:null}catch(_){return null}}
function parseList(s){s=String(s).trim();if(s[0]==='['&&s.endsWith(']'))s=s.slice(1,-1);const o=[];let d=0,c='';for(const ch of s){if('(['.includes(ch))d++;if(')]'.includes(ch))d--;if(ch===','&&d===0){o.push(c);c=''}else c+=ch}if(c.trim())o.push(c);return o.map(x=>x.trim()).filter(Boolean)}
function mkF(expr,v){const c=math.compile(norm(expr));return x=>{try{const r=c.evaluate({[v]:x,...mkScope()});return typeof r==='number'?r:NaN}catch(_){return NaN}}}
function scanRoots(f,lo=-100,hi=100,n=20000){const out=[];let px=lo,py=f(px);for(let i=1;i<=n;i++){const x=lo+(hi-lo)*i/n,y=f(x);if(isFinite(py)&&isFinite(y)){if(py===0)out.push(px);else if(py*y<0){let a=px,b=x,fa=py;for(let k=0;k<80;k++){const m=(a+b)/2,fm=f(m);if(fa*fm<=0)b=m;else{a=m;fa=fm}}const m=(a+b)/2;if(Math.abs(f(m))<1e-6)out.push(m)}}px=x;py=y}return [...new Set(out.map(v=>+v.toFixed(8)))]}
function polySteps(expr,v){try{const f=mkF(expr,v),R=n=>fmt(+n.toPrecision(10));const f0=f(0),f1=f(1),fm=f(-1),f2=f(2),f3=f(3);const a=(f1+fm)/2-f0,b=(f1-fm)/2,c=f0;if(![a,b,c].every(isFinite))return null;if(Math.abs(f2-(4*a+2*b+c))>1e-6||Math.abs(f3-(9*a+3*b+c))>1e-6)return null;
 if(Math.abs(a)<1e-12){if(Math.abs(b)<1e-12)return null;return [`${R(b)}·${v} + ${R(c)} = 0`,`${v} = −(${R(c)}) / ${R(b)} = ${R(-c/b)}`]}

function doEq(input,vn){const raw=prep(input);const idx=raw.indexOf('=');let l=raw,r='0';if(idx>=0){l=raw.slice(0,idx);r=raw.slice(idx+1)}if(!l.trim()||!r.trim())throw new Error(L('المعادلة ناقصة','Incomplete equation'));
 const expr=`(${l})-(${r})`;const vars=nerdamer(expr).variables();const v=vn||(vars.includes('x')?'x':vars[0]);
 if(!v){const a=fmt(evalExpr(l)),b=fmt(evalExpr(r));card(L('تحقق','Check'),ansH(`${a} ${a===b?'=':'≠'} ${b}`)+`<div class="dec">${a===b?L('✓ صحيحة','✓ True'):L('✗ غير صحيحة','✗ False')}</div>`);return}
 let roots=[],method=L('رمزي (دقيق)','Symbolic (exact)');

function doSystem(txt){const eqs=txt.split(/[;\n]+/).map(prep).filter(Boolean);if(eqs.length<2)throw new Error(L('محتاج معادلتين على الأقل (افصل بـ ;)','Need 2+ equations (separate with ;)'));const vars=new Set();eqs.forEach(e=>{const [l,r='0']=e.split('=');nerdamer((${l})-(${r})).variables().forEach(v=>vars.add(v))});let sol=null;
try{const r=nerdamer.solveEquations(eqs);if(Array.isArray(r))sol=r.map(p=>[String(p[0]),String(p[1])]);else if(r&&typeof r==='object')sol=Object.entries(r).map(([k,v])=>[k,String(v)])}catch(){}

if(!sol||!sol.length||sol.some(p=>/^?

?$/.test(p[1]))){try{const vs=[...vars],fs=eqs.map(e=>{const [l,r='0']=e.split('=');const c=math.compile(`(${l})-(${r})`);return s=>c.evaluate(s)}),z=Object.fromEntries(vs.map(k=>[k,0])),A=[],B=[];fs.forEach(f=>{const f0=f(z);A.push(vs.map(k=>f({...z,[k]:1})-f0));B.push(-f0)});if(A.length===vs.length){const x=math.lusolve(A,B).map(q=>Array.isArray(q)?q[0]:q);sol=vs.map((k,i)=>[k,String(+x[i].toPrecision(12))]);method=L('جبر خطّي','Linear algebra')}}catch(_){}}
 if(!sol||!sol.length)throw new Error(L('مقدرتش أحل النظام ده','Could not solve this system'));
 card(`${L('حل النظام','System solution')} <small>(${method})</small>`,sol.map(p=>ansH(`${p[0]} = ${p[1]}`,approx(p[1]))).join(''))}
function runMode(mode,input,vn,a,b){const raw=prep(input),v=vn||(nerdamer(raw.split('=')[0]||'0').variables().includes('x')?'x':(nerdamer(raw).variables()[0]||'x'));
 if(mode==='solve')return doEq(input,vn);
 if(mode==='system')return doSystem(input);
 if(mode==='diff'){const d1=nerdamer(`diff(${raw},${v})`).toString(),d2=nerdamer(`diff(${raw},${v},2)`).toString();card(`${L('المشتقة الأولى','First derivative')} d/d${v}`,ansH(d1));card(L('المشتقة الثانية','Second derivative'),ansH(d2))}

/* ---------- History ---------- */
let hist=[];try{hist=JSON.parse(localStorage.getItem('rosto_h')||'[]')}catch(){}
function addHist(t,q,a){if(!q||!a)return;if(hist[0]&&hist[0].q===q&&hist[0].a===a)return;hist.unshift({t,q,a,d:Date.now()});hist=hist.slice(0,100);try{localStorage.setItem('rosto_h',JSON.stringify(hist))}catch(){}if(curTab==='hist')renderHist()}
let hT;const addHistDebounced=(t,q,a)=>{clearTimeout(hT);hT=setTimeout(()=>addHist(t,q,a),1500)};
const ICON={calc:'🧮',solve:'🧠',geo:'📐',sci:'🔬',matrix:'▦'};
function renderHist(){$('#h-list').innerHTML=hist.length?hist.map((h,i)=>`<div class="hist-i" data-i="${i}"><small>${ICON[h.t]||''} ${esc(h.q)}</small><b>${esc(h.a)}</b></div>`).join(''):`<div class="hint">${L('مفيش حاجة لسه — أي عملية حسابية هتظهر هنا.','Nothing yet — your calculations will show up here.')}</div>`;$$('.hist-i').forEach(e=>e.onclick=()=>{const h=hist[e.dataset.i];if(h.t==='calc'){$('#expr').value=h.q;live();showTab('calc')}else if(h.t==='solve'){$('#sv-in').value=h.q.replace(/ ; /g,'\n');showTab('solve')}})}
$('#h-clear').onclick=()=>{hist=[];try{localStorage.removeItem('rosto_h')}catch(_){}renderHist()};

/* ---------- Theme / lang ---------- */
const THEMES=['neon','ocean','sunset','forest','royal','light'];
$('#btn-theme').onclick=()=>{themeI=(themeI+1)%THEMES.length;document.body.dataset.theme=THEMES[themeI];try{localStorage.setItem('rosto_t',themeI)}catch(_){}gDraw()};
$('#btn-lang').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('rosto_l',lang)}catch(){}applyLang()};
try{const t=+localStorage.getItem('rosto_t');if(t>=0&&t<THEMES.length){themeI=t;document.body.dataset.theme=THEMES[t]}const l=localStorage.getItem('rosto_l');if(l)lang=l}catch(){}
buildKeypad();applyLang();
if(!hasM()||!hasN())setTimeout(()=>toast(L('محتاج نت أول مرة عشان تتحمّل المكتبات','Internet needed once to load the math libraries')),800);
})();
</script>
