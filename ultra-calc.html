<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRA CALC ∞ | روستو</title>
    <meta name="theme-color" content="#0a0a12">
    <link rel="manifest" href="manifest.json"> <!-- لجعله تطبيقاً قابلاً للتثبيت -->
    
    <!-- خطوط عربية وإنجليزية فاخرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0066ff;
            --bg-dark: #0a0a12;
            --surface: #151520;
            --text-main: #ffffff;
            --text-dim: #8888aa;
            --glass: rgba(255, 255, 255, 0.05);
            --shadow-glow: 0 0 20px rgba(0, 102, 255, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            overflow: hidden; /* منع السكرول لتحسين الأداء */
        }

        /* --- Header & Branding --- */
        header {
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.4), transparent);
        }
        .brand { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
        .brand span { color: var(--primary); }

        /* --- Display Screen --- */
        .display-area {
            flex: 1; display: flex; flex-direction: column; 
            justify-content: flex-end; padding: 20px;
            text-align: right; position: relative;
        }
        .history-preview {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim); font-size: 0.9rem; margin-bottom: 5px;
            opacity: 0.7; min-height: 20px;
        }
        .main-input {
            width: 100%; background: transparent; border: none; outline: none;
            color: var(--text-main); font-size: 2.5rem; text-align: right;
            font-family: 'JetBrains Mono', monospace;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        .result-preview {
            font-size: 1.5rem; color: var(--primary); 
            margin-top: 10px; min-height: 30px; font-weight: bold;
        }

        /* --- Tools Bar (Scrollable) --- */
        .tools-bar {
            display: flex; gap: 10px; padding: 10px 20px;
            overflow-x: auto; scrollbar-width: none;
            border-top: 1px solid var(--glass); border-bottom: 1px solid var(--glass);
        }
        .tool-btn {
            background: var(--surface); border: 1px solid var(--glass);
            color: var(--text-dim); padding: 8px 15px; border-radius: 20px;
            font-size: 0.8rem; white-space: nowrap; transition: all 0.2s;
        }
        .tool-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* --- Keypad Grid --- */
        .keypad {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 12px; padding: 20px; padding-bottom: 30px;
            background: var(--bg-dark);
        }
        .key {
            background: var(--surface); border: none; border-radius: 16px;
            color: var(--text-main); font-size: 1.4rem; font-weight: 600;
            height: 65px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s, background 0.2s;
            will-change: transform; /* تسريع اللمس */
        }
        .key:active { transform: scale(0.92); background: #252535; }
        .key.op { color: var(--primary); font-size: 1.6rem; }
        .key.eq { 
            background: var(--primary); color: #fff; 
            box-shadow: var(--shadow-glow); grid-column: span 2;
        }
        .key.fn { font-size: 1rem; color: var(--text-dim); }

        /* --- Graph/OCR Overlay --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 100;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        .overlay.open { transform: translateY(0); }
        .overlay-header { padding: 20px; display: flex; justify-content: space-between; }
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; }

        /* --- Loading Animation --- */
        .loader {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; border: 3px solid var(--glass);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; display: none;
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    </style>
</head>
<body>

    <header>
        <div class="brand">ULTRA CALC <span>∞</span></div>
        <button id="btn-theme" style="background:none;border:none;color:#fff;font-size:1.2rem;">🎨</button>
    </header>

    <div class="display-area">
        <div class="history-preview" id="hist-prev"></div>
        <input type="text" class="main-input" id="expr" placeholder="0" autocomplete="off" inputmode="decimal">
        <div class="result-preview" id="res-prev"></div>
    </div>

    <div class="tools-bar">
        <button class="tool-btn active" data-tab="calc">🧮 حساب</button>
        <button class="tool-btn" data-tab="graph">📈 رسم</button>
        <button class="tool-btn" data-tab="solve"> حل ذكي</button>
        <button class="tool-btn" data-tab="ocr"> مسح</button>
        <button class="tool-btn" data-tab="matrix"> مصفوفات</button>
    </div>

    <div class="keypad" id="keypad">
        <!-- سيتم توليد الأزرار ديناميكياً للأداء الأفضل -->
    </div>

    <div class="loader" id="loader"></div>

    <!-- Overlay for Graph/Solve -->
    <div class="overlay" id="overlay">
        <div class="overlay-header">
            <h3 id="overlay-title">الميزة</h3>
            <button class="close-btn" onclick="toggleOverlay(false)">✕</button>
        </div>
        <div id="overlay-content" style="flex:1; padding:20px; overflow:auto;"></div>
    </div>

<script>
/**
 * ULTRA CALC PRO - ROSTU EDITION
 * Optimized for Zero-Lag & High Performance
 */

// --- State Management ---
const state = {
    expr: '',
    mode: 'calc',
    history: JSON.parse(localStorage.getItem('rosto_h') || '[]'),
    themeIndex: 0
};

const DOM = {
    expr: document.getElementById('expr'),
    res: document.getElementById('res-prev'),
    hist: document.getElementById('hist-prev'),
    keypad: document.getElementById('keypad'),
    loader: document.getElementById('loader'),
    overlay: document.getElementById('overlay')
};

// --- Core Math Engine (Lightweight) ---
// نستخدم eval آمن ومخصص بدلاً من تحميل مكتبات ضخمة فوراً
function safeEval(expression) {
    try {
        // تنظيف المدخلات وتحويل الرموز العربية/الخاصة
        let clean = expression
            .replace(/×/g, '*').replace(/÷/g, '/')
            .replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E')
            .replace(/sin/g, 'Math.sin').replace(/cos/g, 'Math.cos')
            .replace(/tan/g, 'Math.tan').replace(/log/g, 'Math.log10')
            .replace(/ln/g, 'Math.log').replace(/\^/g, '**');
            
        // منع الأكواد الخبيثة
        if (/[^0-9+\-*/().\sMathPIEsincotalgqrt]/.test(clean)) return 'Error';
        
        return new Function('return ' + clean)();
    } catch (e) {
        return null; // Null means incomplete expression, not error
    }
}

// --- UI Rendering (Optimized) ---
const keys = [
    ['C', '⌫', '%', '÷'],
    ['7', '8', '9', '×'],
    ['4', '5', '6', '-'],
    ['1', '2', '3', '+'],
    ['0', '.', '(', ')'],
    ['sin', 'cos', '√', '=']
];

function renderKeypad() {
    DOM.keypad.innerHTML = '';
    keys.forEach(row => {
        row.forEach(k => {
            const btn = document.createElement('button');
            btn.className = `key ${['÷','×','-','+','='].includes(k)?'op':''} ${k==='='?'eq':''} ${['sin','cos','√','%'].includes(k)?'fn':''}`;
            btn.textContent = k;
            btn.onclick = () => handleKey(k);
            DOM.keypad.appendChild(btn);
        });
    });
}

// --- Interaction Logic ---
function handleKey(k) {
    if (k === 'C') { state.expr = ''; updateDisplay(); return; }
    if (k === '⌫') { state.expr = state.expr.slice(0, -1); updateDisplay(); return; }
    if (k === '=') { solve(); return; }
    
    state.expr += k;
    updateDisplay();
    
    // Live Preview (Debounced for performance)
    clearTimeout(window.previewTimer);
    window.previewTimer = setTimeout(() => {
        const res = safeEval(state.expr);
        if (res !== null && res !== undefined) DOM.res.textContent = parseFloat(res.toFixed(8));
        else DOM.res.textContent = '';
    }, 100);
}

function updateDisplay() {
    DOM.expr.value = state.expr;
    DOM.hist.textContent = state.history.length ? state.history[0].q + ' =' : '';
}

function solve() {
    const res = safeEval(state.expr);
    if (res !== null && res !== undefined) {
        const finalRes = parseFloat(res.toFixed(10));
        addToHistory(state.expr, finalRes);
        state.expr = String(finalRes);
        updateDisplay();
        DOM.res.textContent = '';
        
        // Haptic Feedback (Vibration)
        if (navigator.vibrate) navigator.vibrate(10);
    }
}

function addToHistory(q, a) {
    state.history.unshift({ q, a, d: Date.now() });
    if (state.history.length > 50) state.history.pop();
    localStorage.setItem('rosto_h', JSON.stringify(state.history));
    updateDisplay();
}

// --- Advanced Features Loader (Lazy Load) ---
async function loadFeature(feature) {
    DOM.loader.style.display = 'block';
    toggleOverlay(true);
    
    // محاكاة التحميل السريع (في التطبيق الحقيقي هنا يتم استدعاء المكتبات)
    setTimeout(() => {
        DOM.loader.style.display = 'none';
        const content = document.getElementById('overlay-content');
        
        if (feature === 'graph') {
            content.innerHTML = '<div style="text-align:center; padding:50px; color:#888;">📈 منطقة الرسم البياني التفاعلي<br><small>سيتم تفعيل Plotly.js هنا</small></div>';
        } else if (feature === 'solve') {
            content.innerHTML = '<div style="text-align:center; padding:50px; color:#888;">🧠 المحرك الذكي للحلول<br><small>سيتم تفعيل Nerdamer هنا</small></div>';
        } else if (feature === 'ocr') {
            content.innerHTML = '<div style="text-align:center; padding:50px; color:#888;"> كاميرا المسح الضوئي<br><small>سيتم تفعيل Tesseract.js هنا</small></div>';
        }
    }, 400);
}

function toggleOverlay(show) {
    if (show) DOM.overlay.classList.add('open');
    else DOM.overlay.classList.remove('open');
}

// --- Event Listeners ---
document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const tab = e.target.dataset.tab;
        if (tab !== 'calc') loadFeature(tab);
        else toggleOverlay(false);
    });
});

// Keyboard Support
document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9' || ['+','-','*','/','.','(',')'].includes(e.key)) {
        state.expr += e.key; updateDisplay();
    } else if (e.key === 'Enter') solve();
    else if (e.key === 'Backspace') handleKey('⌫');
    else if (e.key === 'Escape') handleKey('C');
});

// Init
renderKeypad();
updateDisplay();

</script>
</body>
</html>
