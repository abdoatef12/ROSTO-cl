<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRA CALC ∞ | ROSTU ULTIMATE</title>
    <meta name="theme-color" content="#000000">
    
    <!-- مكتبات القوة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #bc13fe;
            --bg-dark: #05050a;
            --surface: rgba(255, 255, 255, 0.03);
            --glass: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #6c7585;
            --shadow-glow: 0 0 20px rgba(0, 242, 255, 0.15);
            --key-bg: rgba(30, 30, 40, 0.6);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at 50% 0%, #1a1a2e, var(--bg-dark));
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass);
            z-index: 10;
        }
        .brand { font-size: 1rem; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .brand span { 
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- Display --- */
        .display-area {
            flex: 1; display: flex; flex-direction: column; 
            justify-content: flex-end; padding: 20px 25px;
            text-align: right; position: relative;
        }
        .history-preview {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim); font-size: 0.85rem; margin-bottom: 5px;
            opacity: 0.5; min-height: 18px; direction: ltr; text-align: right;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .main-input {
            width: 100%; background: transparent; border: none;
            color: var(--text-main); font-size: 3rem; text-align: right;
            font-family: 'JetBrains Mono', monospace; font-weight: 300;
            text-shadow: 0 0 10px rgba(255,255,255,0.05);
        }
        .result-preview {
            font-size: 1.5rem; color: var(--primary); 
            margin-top: 5px; min-height: 30px; font-weight: bold;
            text-shadow: var(--shadow-glow); direction: ltr; text-align: right;
        }

        /* --- Tools Bar --- */
        .tools-bar {
            display: flex; gap: 10px; padding: 10px 15px;
            overflow-x: auto; scrollbar-width: none;
            border-top: 1px solid var(--glass); border-bottom: 1px solid var(--glass);
            background: rgba(0,0,0,0.3);
        }
        .tool-btn {
            background: var(--surface); border: 1px solid var(--glass);
            color: var(--text-dim); padding: 6px 14px; border-radius: 10px;
            font-size: 0.75rem; white-space: nowrap; transition: all 0.2s;
            backdrop-filter: blur(5px); font-family: 'Cairo';
        }
        .tool-btn.active { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; border-color: transparent; box-shadow: var(--shadow-glow);
        }

        /* --- Keypad --- */
        .keypad-container {
            background: linear-gradient(0deg, var(--bg-dark) 20%, transparent);
            padding: 15px; padding-top: 25px;
        }
        .keypad {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 10px; max-width: 600px; margin: 0 auto;
        }
        .key {
            background: var(--key-bg); border: 1px solid var(--glass);
            color: var(--text-main); font-size: 1.1rem; font-weight: 500;
            height: 55px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.1s; backdrop-filter: blur(10px);
            font-family: 'JetBrains Mono';
        }
        .key:active { transform: scale(0.92); background: rgba(255,255,255,0.1); }
        .key.op { color: var(--primary); font-size: 1.3rem; }
        .key.fn { font-size: 0.8rem; color: var(--secondary); }
        .key.eq { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; border: none; grid-column: span 2;
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.3);
        }
        .key.clear { color: #ff4757; }

        /* --- Overlays --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.98); z-index: 100;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; backdrop-filter: blur(20px);
        }
        .overlay.open { transform: translateY(0); }
        .overlay-header { 
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass);
        }
        .close-btn { 
            background: rgba(255,255,255,0.1); border: none; color: #fff; 
            width: 35px; height: 35px; border-radius: 50%; cursor: pointer;
        }

        /* --- Inputs in Overlay --- */
        .adv-input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass); color: #fff; border-radius: 8px;
            margin-bottom: 10px; font-family: 'JetBrains Mono';
        }
        .adv-btn {
            width: 100%; padding: 12px; background: var(--surface);
            border: 1px solid var(--primary); color: var(--primary);
            border-radius: 8px; cursor: pointer; font-weight: bold;
        }

        @media (min-width: 768px) {
            .keypad { grid-template-columns: repeat(6, 1fr); gap: 15px; }
            .key { height: 70px; font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">ULTRA CALC <span>∞</span></div>
        <button onclick="toggleTheme()" style="background:none;border:none;color:#fff;font-size:1.2rem;">🎨</button>
    </header>

    <div class="display-area">
        <div class="history-preview" id="hist-prev"></div>
        <input type="text" class="main-input" id="expr" placeholder="0" autocomplete="off" inputmode="decimal" dir="ltr">
        <div class="result-preview" id="res-prev"></div>
    </div>

    <div class="tools-bar">
        <button class="tool-btn active" data-tab="calc">🧮 أساسي</button>
        <button class="tool-btn" data-tab="graph">📈 رسم 2D/3D</button>
        <button class="tool-btn" data-tab="solve">🧠 جبر</button>
        <button class="tool-btn" data-tab="matrix">🔢 مصفوفات</button>
        <button class="tool-btn" data-tab="units">⚖️ وحدات</button>
        <button class="tool-btn" data-tab="const">🌌 ثوابت</button>
    </div>

    <div class="keypad-container">
        <div class="keypad" id="keypad"></div>
    </div>

    <div class="overlay" id="overlay">
        <div class="overlay-header">
            <h3 id="overlay-title" style="margin:0;color:var(--primary)">الميزة المتقدمة</h3>
            <button class="close-btn" onclick="toggleOverlay(false)">✕</button>
        </div>
        <div id="overlay-content" style="flex:1; padding:20px; overflow:auto;"></div>
    </div>

<script>
/**
 * ULTRA CALC PRO - ROSTU ULTIMATE EDITION
 * Full Math Engine, Graphing, Units, Matrices & More
 */

// --- State & Config ---
const state = {
    expr: '',
    isRad: true, // Radians by default
    history: JSON.parse(localStorage.getItem('rosto_h_v3') || '[]'),
};

const DOM = {
    expr: document.getElementById('expr'),
    res: document.getElementById('res-prev'),
    hist: document.getElementById('hist-prev'),
    keypad: document.getElementById('keypad'),
    overlay: document.getElementById('overlay'),
    overlayContent: document.getElementById('overlay-content'),
    overlayTitle: document.getElementById('overlay-title')
};

// --- Advanced Math Configuration ---
math.config({ number: 'number' }); // Support for BigNumbers if needed later

// --- Key Layouts (Dynamic) ---
const layouts = {
    calc: [
        ['C', '⌫', '%', '÷', '√'],
        ['sin', 'cos', 'tan', '×', '^'],
        ['7', '8', '9', '-', 'π'],
        ['4', '5', '6', '+', 'e'],
        ['1', '2', '3', '(', ')'],
        ['0', '.', 'ln', 'log', '=']
    ],
    sci: [
        ['C', '⌫', '!', '÷', 'nCr'],
        ['asin', 'acos', 'atan', '×', 'mod'],
        ['sinh', 'cosh', 'tanh', '-', 'i'],
        ['7', '8', '9', '+', 'E'],
        ['4', '5', '6', '(', ')'],
        ['1', '2', '3', '.', '=']
    ]
};

let currentLayout = 'calc';

function renderKeypad() {
    DOM.keypad.innerHTML = '';
    const keys = layouts[currentLayout];
    
    keys.forEach(row => {
        row.forEach(k => {
            const btn = document.createElement('button');
            let className = 'key';
            if (['÷','×','-','+','='].includes(k)) className += ' op';
            if (['sin','cos','tan','asin','log','ln','√','π','e','i'].includes(k)) className += ' fn';
            if (k === 'C') className += ' clear';
            if (k === '=') className += ' eq';
            
            btn.className = className;
            btn.textContent = k;
            btn.onclick = () => handleKey(k);
            DOM.keypad.appendChild(btn);
        });
    });
}

// --- Core Logic ---
function handleKey(k) {
    if (k === 'C') { state.expr = ''; updateDisplay(); return; }
    if (k === '⌫') { state.expr = state.expr.slice(0, -1); updateDisplay(); return; }
    if (k === '=') { solve(); return; }
    
    // Smart replacements
    let val = k;
    if (k === '√') val = 'sqrt(';
    if (k === 'π') val = 'pi';
    if (k === '×') val = '*';
    if (k === '÷') val = '/';
    
    state.expr += val + ' ';
    updateDisplay();
    
    // Live Preview
    clearTimeout(window.previewTimer);
    window.previewTimer = setTimeout(() => {
        try {
            const res = math.evaluate(state.expr);
            if (res !== undefined && res !== null) {
                DOM.res.textContent = math.format(res, { precision: 12 });
            }
        } catch(e) {}
    }, 200);
}

function updateDisplay() {
    DOM.expr.value = state.expr;
    DOM.hist.textContent = state.history.length ? state.history[0].q + ' =' : '';
}

function solve() {
    try {
        const res = math.evaluate(state.expr);
        const formatted = math.format(res, { precision: 14 });
        addToHistory(state.expr, formatted);
        state.expr = String(formatted);
        updateDisplay();
        DOM.res.textContent = '';
        if (navigator.vibrate) navigator.vibrate(20);
    } catch (e) {
        DOM.res.textContent = 'Error';
        setTimeout(() => DOM.res.textContent = '', 1500);
    }
}

function addToHistory(q, a) {
    state.history.unshift({ q, a, d: Date.now() });
    if (state.history.length > 100) state.history.pop();
    localStorage.setItem('rosto_h_v3', JSON.stringify(state.history));
    updateDisplay();
}

// --- Advanced Features Implementation ---
async function loadFeature(feature) {
    toggleOverlay(true);
    DOM.overlayContent.innerHTML = '<div style="text-align:center;padding:50px;">جاري تحميل المحرك...</div>';
    
    setTimeout(() => {
        DOM.overlayContent.innerHTML = '';
        
        if (feature === 'graph') {
            DOM.overlayTitle.textContent = 'الرسم البياني الفائق';
            DOM.overlayContent.innerHTML = `
                <div style="display:flex;gap:10px;margin-bottom:10px;">
                    <input type="text" id="graph-expr" class="adv-input" placeholder="مثال: sin(x) أو x^2 + y^2 - 9" value="${state.expr || 'sin(x)'}">
                    <button onclick="drawGraph()" class="adv-btn" style="width:80px">ارسم</button>
                </div>
                <div id="plot-div" style="width:100%;height:60vh;background:rgba(0,0,0,0.2);border-radius:10px;"></div>
            `;
            drawGraph();
        } else if (feature === 'solve') {
            DOM.overlayTitle.textContent = 'حل المعادلات الجبرية';
            DOM.overlayContent.innerHTML = `
                <p>أدخل المعادلة (استخدم == للمساواة)</p>
                <input type="text" id="eq-input" class="adv-input" placeholder="x^2 - 4 == 0">
                <button onclick="solveEquation()" class="adv-btn">حل المعادلة</button>
                <div id="eq-result" style="margin-top:20px;font-size:1.2rem;color:var(--primary);direction:ltr;text-align:right;"></div>
            `;
        } else if (feature === 'matrix') {
            DOM.overlayTitle.textContent = 'مختبر المصفوفات';
            DOM.overlayContent.innerHTML = `
                <textarea id="mat-a" class="adv-input" rows="3" placeholder="[[1,2],[3,4]]">[[1,2],[3,4]]</textarea>
                <textarea id="mat-b" class="adv-input" rows="3" placeholder="[[5,6],[7,8]]">[[5,6],[7,8]]</textarea>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <button onclick="calcMatrix('add')" class="adv-btn">جمع A+B</button>
                    <button onclick="calcMatrix('multiply')" class="adv-btn">ضرب A*B</button>
                    <button onclick="calcMatrix('det')" class="adv-btn">محدد A</button>
                    <button onclick="calcMatrix('inv')" class="adv-btn">معكوس A</button>
                </div>
                <div id="mat-result" style="margin-top:20px;font-family:'JetBrains Mono';color:var(--primary);white-space:pre-wrap;"></div>
            `;
        } else if (feature === 'units') {
            DOM.overlayTitle.textContent = 'محول الوحدات الشامل';
            DOM.overlayContent.innerHTML = `
                <input type="number" id="unit-val" class="adv-input" placeholder="القيمة" value="1">
                <select id="unit-from" class="adv-input">
                    <option value="meter">متر (m)</option>
                    <option value="foot">قدم (ft)</option>
                    <option value="kg">كيلوجرام (kg)</option>
                    <option value="lb">باوند (lb)</option>
                    <option value="celsius">سيليزي (C)</option>
                    <option value="fahrenheit">فهرنهايت (F)</option>
                </select>
                <select id="unit-to" class="adv-input">
                    <option value="foot">قدم (ft)</option>
                    <option value="meter">متر (m)</option>
                    <option value="lb">باوند (lb)</option>
                    <option value="kg">كيلوجرام (kg)</option>
                    <option value="fahrenheit">فهرنهايت (F)</option>
                    <option value="celsius">سيليزي (C)</option>
                </select>
                <button onclick="convertUnit()" class="adv-btn">تحويل</button>
                <div id="unit-result" style="margin-top:20px;font-size:1.5rem;color:var(--primary);"></div>
            `;
        } else if (feature === 'const') {
            DOM.overlayTitle.textContent = 'الثوابت الفيزيائية';
            const consts = {
                'سرعة الضوء (c)': '299792458 m/s',
                'ثابت بلانك (h)': '6.62607015e-34 J.s',
                'الجاذبية (g)': '9.80665 m/s^2',
                'عدد أفوجادرو (NA)': '6.02214076e23 mol^-1'
            };
            let html = '<div style="display:grid;gap:10px;">';
            for (let [k,v] of Object.entries(consts)) {
                html += `<div style="background:var(--surface);padding:15px;border-radius:8px;border:1px solid var(--glass);"><b>${k}</b><br><span style="color:var(--primary);direction:ltr;display:block">${v}</span></div>`;
            }
            DOM.overlayContent.innerHTML = html + '</div>';
        }
    }, 300);
}

// --- Feature Logics ---
window.drawGraph = function() {
    const expr = document.getElementById('graph-expr').value;
    try {
        // Check if 3D (contains x and y)
        if (expr.includes('x') && expr.includes('y')) {
            const size = 50;
            const matrix = [];
            for (let j = 0; j < size; j++) {
                const row = [];
                for (let i = 0; i < size; i++) {
                    const x = (i / size) * 10 - 5;
                    const y = (j / size) * 10 - 5;
                    row.push(math.evaluate(expr, {x, y}));
                }
                matrix.push(row);
            }
            Plotly.newPlot('plot-div', [{z: matrix, type: 'surface'}], {margin:{t:0,b:0,l:0,r:0}});
        } else {
            // 2D Graph
            const values = [];
            for (let x = -10; x <= 10; x += 0.2) {
                values.push({x, y: math.evaluate(expr, {x})});
            }
            Plotly.newPlot('plot-div', [{
                x: values.map(v=>v.x), y: values.map(v=>v.y), 
                type: 'scatter', line: {color: '#00f2ff', width: 3}
            }], {paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)', font:{color:'#fff'}, margin:{t:30,b:30,l:30,r:30}});
        }
    } catch(e) { console.error(e); }
}

window.solveEquation = function() {
    const eq = document.getElementById('eq-input').value;
    try {
        const res = math.solve(eq, 'x');
        document.getElementById('eq-result').textContent = 'الحل: ' + res.toString();
    } catch(e) { document.getElementById('eq-result').textContent = 'خطأ في الصيغة'; }
}

window.calcMatrix = function(op) {
    try {
        const a = math.matrix(eval(document.getElementById('mat-a').value));
        const b = math.matrix(eval(document.getElementById('mat-b').value));
        let res;
        if (op === 'add') res = math.add(a, b);
        else if (op === 'multiply') res = math.multiply(a, b);
        else if (op === 'det') res = math.det(a);
        else if (op === 'inv') res = math.inv(a);
        document.getElementById('mat-result').textContent = math.format(res, {precision: 4});
    } catch(e) { document.getElementById('mat-result').textContent = 'تأكد من صيغة المصفوفة [[a,b],[c,d]]'; }
}

window.convertUnit = function() {
    try {
        const val = document.getElementById('unit-val').value;
        const from = document.getElementById('unit-from').value;
        const to = document.getElementById('unit-to').value;
        const res = math.unit(val, from).to(to);
        document.getElementById('unit-result').textContent = res.format(4);
    } catch(e) { document.getElementById('unit-result').textContent = 'وحدات غير متوافقة'; }
}

function toggleOverlay(show) {
    if (show) DOM.overlay.classList.add('open');
    else DOM.overlay.classList.remove('open');
}

// --- Theme Toggle ---
let themeIndex = 0;
window.toggleTheme = function() {
    const themes = [
        {p: '#00f2ff', s: '#bc13fe'}, // Cyber
        {p: '#ff0055', s: '#ffcc00'}, // Sunset
        {p: '#00ff9d', s: '#00b8ff'}  // Matrix
    ];
    themeIndex = (themeIndex + 1) % themes.length;
    document.documentElement.style.setProperty('--primary', themes[themeIndex].p);
    document.documentElement.style.setProperty('--secondary', themes[themeIndex].s);
}

// --- Init ---
document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const tab = e.target.dataset.tab;
        if (tab === 'calc') {
            toggleOverlay(false);
            currentLayout = 'calc';
        } else if (tab === 'sci') {
            toggleOverlay(false);
            currentLayout = 'sci';
        } else {
            loadFeature(tab);
        }
        renderKeypad();
    });
});

renderKeypad();
updateDisplay();

</script>
</body>
</html>
